name: Verify AgentWall Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: dashboard/package-lock.json

    - name: Verify dashboard
      env:
        CYPRESS_INSTALL_BINARY: "0"
      working-directory: dashboard
      run: |
        npm ci
        npm test
        npm run build
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgomp1
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Security Test Suite (Unit Tests)
      env:
        AGENTWALL_DB: ":memory:"
        AGENTWALL_ADMIN_PASSWORD: test_admin
        AGENTWALL_AUTH_ENABLED: "0"
        PYTHONPATH: .
      run: |
        python -m pytest tests/
        
    - name: Run Evals Benchmarking (TPR/FPR)
      env:
        AGENTWALL_DB: ":memory:"
        AGENTWALL_ADMIN_PASSWORD: test_evals
        AGENTWALL_AUTH_ENABLED: "0"
        PYTHONPATH: .
      run: |
        python evals/run_benchmarks.py
        
    - name: Run Attribution Accuracy Experiment
      env:
        PYTHONPATH: .
      run: |
        python evals/attribution_accuracy.py
        
    - name: Smoke Test (Server Startup)
      env:
        AGENTWALL_ADMIN_PASSWORD: admin
        AGENTWALL_AUTH_ENABLED: "0"
        AGENTWALL_DB: ":memory:"
        PYTHONPATH: .
      run: |
        # Start server in background and capture output
        python -m uvicorn agentwall.main:app --host 127.0.0.1 --port 8080 > server_log.txt 2>&1 &
        SERVER_PID=$!
        
        # Wait to see if it stays alive
        sleep 10
        
        # Check if process is still running
        if kill -0 $SERVER_PID 2>/dev/null; then
          echo "Server started successfully."
          kill $SERVER_PID
        else
          echo "Server crashed on startup! Logs:"
          cat server_log.txt
          exit 1
        fi

    - name: Docker Build Test
      run: |
        docker build -t agentwall-test .

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.txt
    - run: python -m pytest tests -q

  dashboard-e2e:
    runs-on: ubuntu-latest
    env:
      AGENTWALL_ADMIN_PASSWORD: e2e-admin-password-not-secret
      AGENTWALL_API_KEYS: e2e-agent-key-0123456789abcdef0123456789
      AGENTWALL_DB: /tmp/agentwall-e2e.duckdb
      PYTHONPATH: .
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: dashboard/package-lock.json
    - run: pip install -r requirements.txt
    - name: Build the dashboard
      working-directory: dashboard
      run: npm ci && npm run build
    - name: Start AgentWall
      run: |
        python -m uvicorn agentwall.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
        for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
        cat server.log; exit 1
    - name: Cypress end-to-end tests
      working-directory: dashboard
      run: npm run e2e
    - if: failure()
      run: cat server.log

  vibeaudit:
    # Pre-deployment security audit; fails the build on any high or critical finding.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install vibeaudit
    - run: vibeaudit scan . --fail-on high --no-color
  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install kubeconform
      run: |
        curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
    - name: Render with kustomize and validate against the Kubernetes schemas
      run: kubectl kustomize deploy/k8s | kubeconform -strict -summary -kubernetes-version 1.30.0 -
