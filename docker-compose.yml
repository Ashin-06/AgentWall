services:
  agentwall:
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # the dashboard is served here too
    env_file: .env              # production refuses to start without strong secrets in it
    environment:
      - AGENTWALL_ENV=production
      - AGENTWALL_AUTO_BASELINE_N=50
    volumes:
      - ./agentwall_v2.duckdb:/app/agentwall_v2.duckdb
      - ./config:/app/config
    restart: always
