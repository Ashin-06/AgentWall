services:
  agentwall:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      AGENTWALL_ENV: production
      AGENTWALL_AUTH_ENABLED: "1"
      AGENTWALL_DB: /data/db/agentwall.duckdb
      AGENTWALL_ADMIN_PASSWORD: ${AGENTWALL_ADMIN_PASSWORD:?Set AGENTWALL_ADMIN_PASSWORD in .env}
      AGENTWALL_API_KEYS: ${AGENTWALL_API_KEYS:?Set AGENTWALL_API_KEYS in .env}
      AGENTWALL_JWT_SECRET: ${AGENTWALL_JWT_SECRET:?Set AGENTWALL_JWT_SECRET in .env}
      AGENTWALL_HMAC_KEY: ${AGENTWALL_HMAC_KEY:?Set AGENTWALL_HMAC_KEY in .env}
      AGENTWALL_AUTO_BASELINE_N: "50"
    volumes:
      - agentwall-data:/data
      - ./config:/app/config
    restart: unless-stopped

volumes:
  agentwall-data:
