global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "agentwall"
    static_configs:
      - targets: ["agentwall:8000"]
    metrics_path: "/metrics"
    # /metrics requires auth: put one of AGENTWALL_API_KEYS in this file.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/agentwall_api_key
    scrape_timeout: 10s
